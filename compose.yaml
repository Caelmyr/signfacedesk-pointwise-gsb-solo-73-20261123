name: solo76-signface
services:
  desk:
    build:
      context: .
      args:
        SIGNFACE_RUNTIME_IMAGE: ${SIGNFACE_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${SIGNFACE_IMAGE:-solo76-signface:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${SIGNFACE_PORT:-19996}:8000"
    volumes:
      - sign-library:/var/lib/signface
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/survey/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  sign-library:
